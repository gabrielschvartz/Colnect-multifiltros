name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev libbz2-dev zlib1g-dev \
            libncurses5-dev libsqlite3-dev libreadline-dev \
            autoconf libtool pkg-config cmake libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk*
          key: android-sdk-ndk-${{ runner.os }}-v2

      - name: Instalar Android SDK y aceptar licencias
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH

          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest

          yes | JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 \
            ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

          JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 \
            ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "platform-tools"

          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager \
            ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager

      - name: Restaurar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/colnect.keystore

      - name: Compilar APK release
        run: |
          buildozer android release
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Listar APKs generados
        run: |
          echo "=== Contenido de bin/ ==="
          ls -la bin/ || echo "carpeta bin/ vacía o no existe"
          echo "=== Todos los APKs ==="
          find . -name "*.apk" 2>/dev/null || echo "ningún APK encontrado"

      - name: Firmar APK
        run: |
          echo "=== Buscando APK ==="
          ls -la bin/

          # Intentar distintos patrones de nombre
          APK=$(find bin/ -name "*-release-unsigned.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find bin/ -name "*unsigned*.apk" | head -1); fi
          if [ -z "$APK" ]; then APK=$(find bin/ -name "*release*.apk" | head -1); fi
          if [ -z "$APK" ]; then APK=$(find bin/ -name "*.apk" | head -1); fi

          echo "APK encontrado: $APK"

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró ningún APK en bin/"
            exit 1
          fi

          # Alinear
          ~/.buildozer/android/platform/android-sdk/build-tools/35.0.0/zipalign \
            -v 4 "$APK" bin/colnect-aligned.apk

          # Firmar
          ~/.buildozer/android/platform/android-sdk/build-tools/35.0.0/apksigner sign \
            --ks ~/colnect.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out bin/ColnectMultifiltros-release.apk \
            bin/colnect-aligned.apk

          echo "APK firmado correctamente"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ColnectMultifiltros-APK
          path: bin/ColnectMultifiltros-release.apk
          retention-days: 30
