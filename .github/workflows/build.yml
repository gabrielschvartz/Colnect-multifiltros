name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev libbz2-dev zlib1g-dev \
            libncurses5-dev libsqlite3-dev libreadline-dev \
            autoconf libtool pkg-config cmake libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk*
          key: android-sdk-ndk-${{ runner.os }}-v2

      - name: Instalar Android SDK y aceptar licencias
        run: |
          # Configurar Java 17
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version

          # Descargar command line tools
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest

          # Aceptar todas las licencias automáticamente
          yes | JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 \
            ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Instalar build-tools y platform-tools
          JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 \
            ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "platform-tools"

          # Symlink para que Buildozer encuentre sdkmanager en la ruta antigua
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager \
            ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager

      - name: Compilar APK debug
        run: |
          buildozer android debug
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ColnectMultifiltros-APK
          path: bin/*.apk
          retention-days: 30
