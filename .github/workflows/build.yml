name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev libbz2-dev zlib1g-dev \
            libncurses5-dev libsqlite3-dev libreadline-dev \
            autoconf libtool pkg-config cmake \
            libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk*
          key: android-sdk-ndk-${{ runner.os }}

      - name: Compilar APK debug
        run: |
          buildozer android debug
        env:
          ANDROIDAPI: "35"
          ANDROIDMINAPI: "33"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ColnectMultifiltros-APK
          path: bin/*.apk
          retention-days: 30
